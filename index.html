<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<!-- Root serves the real hub; old lab-kqsverjfjd paths redirect here. Keep noindex until launch. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#05010f">
<title data-i18n="doc.title">CYBER ARCADE</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/hub.css?v=0.5.10">
</head>
<body>
<header id="hub-header">
  <h1>CYBER ARCADE</h1>
  <div class="sub" data-i18n-html="sub"></div>
</header>

<!-- tab panels: browse / categories / favorites share the game grid; profile + settings are own views -->
<section id="view-home" class="hub-view" data-view="browse">
  <div class="hub-search" id="hub-search">
    <div class="hub-search-inner">
      <span class="hub-search-ico" aria-hidden="true">#</span>
      <label class="sr-only" for="game-search" data-i18n="search.label">Search</label>
      <input id="game-search" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" spellcheck="false" maxlength="48" placeholder="Search # / version / name">
      <button type="button" class="hub-search-clear hidden" id="game-search-clear" aria-label="Clear">×</button>
    </div>
  </div>
  <div class="cat-bar hidden" id="cat-bar" role="toolbar" aria-label="Categories"></div>
  <main id="list"><div class="err" data-i18n="loading"></div></main>
  <p class="empty-state hidden" id="empty-state"></p>
</section>

<section id="view-profile" class="hub-view hidden" data-view="profile" aria-label="Tier">
  <div class="settings-sheet profile-sheet">
    <h2 data-i18n="storeTitle"></h2>
    <div class="s-sub" data-i18n="storeSub"></div>
    <div id="tier-cards"></div>
  </div>
</section>

<section id="view-settings" class="hub-view hidden" data-view="settings" aria-label="Settings">
  <div class="settings-sheet">
    <h2 data-i18n="settings.title"></h2>
    <div class="set-block">
      <div class="set-label" data-i18n="settings.audio"></div>
      <button type="button" id="btn-mute" class="set-btn" aria-pressed="false"></button>
    </div>
    <div class="set-block">
      <div class="set-label" data-i18n="settings.language"></div>
      <button type="button" class="set-btn" id="btn-lang-settings" data-i18n="settings.langToggle"></button>
    </div>
    <div class="set-block">
      <label class="set-label" for="profile-name" data-i18n="settings.profile"></label>
      <p class="set-hint" data-i18n="settings.profileHint"></p>
      <input id="profile-name" class="set-input" type="text" maxlength="24" autocomplete="nickname" spellcheck="false">
      <button type="button" id="btn-save-profile" class="set-btn" data-i18n="settings.saveName"></button>
    </div>
    <div class="set-block">
      <div class="set-label" data-i18n="settings.billing"></div>
      <button type="button" id="btn-restore-settings" class="set-btn" data-i18n="restore"></button>
      <p class="set-hint" data-i18n="settings.restoreHint"></p>
      <a class="set-btn privacy-link" href="./privacy.html" data-i18n="about.privacy"></a>
    </div>
    <div class="set-block" id="settings-about">
      <div class="set-label" data-i18n="about.title"></div>
      <p class="about-blurb" data-i18n="about.body"></p>
      <p class="about-meta" id="about-meta"></p>
      <p class="set-hint" data-i18n="about.restoreCue"></p>
    </div>
  </div>
</section>

<!-- 5-slot hub bar: profile · cats · browse FAB · favs · settings -->
<nav class="tabbar" id="tabbar" role="tablist" aria-label="Hub navigation">
  <button type="button" role="tab" class="tab tab-profile" data-tab="profile" aria-selected="false" id="tab-profile">
    <span class="tab-ico" aria-hidden="true">◆</span>
    <span class="tab-label" data-i18n="tab.profile"></span>
  </button>
  <button type="button" role="tab" class="tab" data-tab="cats" aria-selected="false" id="tab-cats">
    <span class="tab-ico" aria-hidden="true">▤</span>
    <span class="tab-label" data-i18n="tab.cats"></span>
  </button>
  <button type="button" role="tab" class="tab tab-fab active" data-tab="browse" aria-selected="true" id="tab-browse">
    <span class="tab-fab-core" aria-hidden="true"><span class="tab-fab-ico">▣</span></span>
    <span class="tab-label" data-i18n="tab.browse"></span>
  </button>
  <button type="button" role="tab" class="tab" data-tab="favs" aria-selected="false" id="tab-favs">
    <span class="tab-ico" aria-hidden="true">★</span>
    <span class="tab-label" data-i18n="tab.favs"></span>
  </button>
  <button type="button" role="tab" class="tab" data-tab="settings" aria-selected="false" id="tab-settings">
    <span class="tab-ico" aria-hidden="true">⚙</span>
    <span class="tab-label" data-i18n="tab.settings"></span>
  </button>
</nav>

<!-- modal shell (store / trial / stub payment) -->
<div class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast hidden" id="toast"></div>

<!-- hidden DEV panel: tap the tier chip 7× or open with ?dev=1 -->
<div class="dev hidden" id="dev">
  <div class="dev-head"><b data-i18n="dev"></b><button id="dev-close" aria-label="close">×</button></div>
  <div class="dev-meta" id="dev-meta"></div>
  <button data-dev="silver" data-i18n="devSilver"></button>
  <button data-dev="gold" data-i18n="devGold"></button>
  <button data-dev="trials" data-i18n="devTrials"></button>
  <button data-dev="wipe" data-i18n="devWipe"></button>
  <button data-dev="reset" data-i18n="devReset"></button>
</div>
<script type="module" src="js/hub.js?v=0.5.10"></script>
</body>
</html>
