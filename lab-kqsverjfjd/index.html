<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#05010f">
<title>CYBER ARCADE · TEST LAB</title>
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: 'Orbitron'; src: url('./Orbitron.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
  :root { --c1: #00e5ff; --c2: #ff2bd6; --c3: #fff35c; --ok: #3bff8a; --bg: #05010f; --zh: system-ui, -apple-system, "Noto Sans TC", "PingFang HK", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: #ddd8ff; font-family: var(--zh); overflow-x: hidden; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -2;
    background: radial-gradient(ellipse at 50% 120%, rgba(255,43,214,.35), transparent 60%), radial-gradient(ellipse at 10% -10%, rgba(0,229,255,.25), transparent 50%), var(--bg); }
  body::after { content: ""; position: fixed; left: -50%; right: -50%; bottom: -10%; height: 55vh; z-index: -1; opacity: .35;
    background-image: linear-gradient(rgba(0,229,255,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(255,43,214,.5) 1px, transparent 1px);
    background-size: 46px 46px; transform: perspective(400px) rotateX(62deg); transform-origin: bottom; animation: grid 3s linear infinite; mask-image: linear-gradient(transparent, #000 70%); }
  @keyframes grid { to { background-position: 0 46px; } }
  header { padding: max(28px, env(safe-area-inset-top)) 20px 8px; text-align: center; }
  .kicker { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 6px; color: var(--c2); text-shadow: 0 0 8px var(--c2); }
  h1 { margin: 6px 0 0; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(30px, 7vw, 54px); letter-spacing: 6px; color: #fff;
    text-shadow: 0 0 10px var(--c1), 0 0 30px var(--c1), 3px 0 0 rgba(255,43,214,.7); }
  .sub { margin-top: 4px; font-size: 13px; letter-spacing: 4px; color: #a49dd0; }
  .legend { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 14px 0 0; font-size: 12px; color: #a49dd0; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px max(40px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .card { position: relative; padding: 18px 18px 16px; background: linear-gradient(160deg, rgba(20,10,48,.85), rgba(8,3,22,.85)); border: 1px solid rgba(0,229,255,.35);
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); box-shadow: inset 0 0 24px rgba(0,229,255,.08); transition: transform .15s, border-color .2s; }
  .card:hover { transform: translateY(-2px); border-color: var(--c1); }
  .card.planned { opacity: .62; border-color: rgba(255,255,255,.18); }
  .card.done { border-color: rgba(59,255,138,.5); }
  .card .idx { position: absolute; right: 16px; top: 12px; font-family: 'Orbitron', sans-serif; font-size: 28px; font-weight: 900; color: rgba(255,255,255,.07); }
  .name-zh { font-size: 24px; font-weight: 800; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px var(--c2); }
  .name-en { font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 4px; color: var(--c1); margin-top: 2px; }
  .genre { margin-top: 8px; font-size: 13px; color: #b9b2e6; }
  .pill { display: inline-block; margin-top: 10px; padding: 3px 10px; font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; border: 1px solid currentColor; }
  .pill.done { color: var(--ok); text-shadow: 0 0 6px var(--ok); }
  .pill.wip { color: var(--c3); text-shadow: 0 0 6px var(--c3); }
  .pill.planned { color: #8d87b5; }
  .pill.retired { color: #ff5577; }
  .meta { margin-top: 6px; font-size: 11px; color: #7f79a8; letter-spacing: 1px; }
  .links { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .links a { flex: 1; min-width: 82px; text-align: center; padding: 10px 8px; text-decoration: none; color: #fff; font-size: 13px; letter-spacing: 2px; font-weight: 700;
    border: 1px solid var(--c1); background: rgba(0,229,255,.1); box-shadow: 0 0 10px rgba(0,229,255,.2); }
  .links a small { display: block; font-family: 'Orbitron', sans-serif; font-size: 8px; letter-spacing: 2px; color: var(--c1); font-weight: 400; }
  .links a.demo { border-color: var(--c2); background: rgba(255,43,214,.1); box-shadow: 0 0 10px rgba(255,43,214,.2); }
  .links a.demo small { color: var(--c2); }
  .links a.repo { flex: 0 0 auto; border-color: rgba(255,255,255,.25); background: transparent; box-shadow: none; }
  .links a.off { pointer-events: none; opacity: .35; filter: grayscale(1); }
  .links a:active { transform: scale(.97); }
  footer { text-align: center; padding: 0 16px 30px; font-size: 11px; color: #6f6996; letter-spacing: 1px; }
  .err { grid-column: 1 / -1; text-align: center; color: #ff8aa5; }
  .lang-btn { position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); z-index: 5; min-width: 44px; height: 44px; padding: 0 10px;
    background: rgba(10,4,30,.6); border: 1px solid var(--c1); color: #fff; font: 700 14px 'Orbitron', var(--zh); letter-spacing: 1px; cursor: pointer; }
  .lang-btn:hover { box-shadow: inset 0 0 12px var(--c1); }
  .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 10px; letter-spacing: 1px; padding: 2px 7px; color: var(--c3); border: 1px solid rgba(255,243,92,.45); }
  html[data-lang="en"] .name-zh { font-family: 'Orbitron', var(--zh); font-size: 20px; }
</style>
</head>
<body>
<button class="lang-btn" id="lang" aria-label="Language / 語言"></button>
<header>
  <div class="kicker" data-k="kicker"></div>
  <h1>CYBER ARCADE</h1>
  <div class="sub" data-k="sub"></div>
  <div class="legend"><span id="count">…</span><span data-k="source"></span></div>
</header>
<main id="list"><div class="err">載入中 Loading…</div></main>
<footer data-k="footer"></footer>
<script>
// Bilingual zh-HK / en — same contract as cyber-kit i18n: localStorage 'cyber.lang', ?lang=en|zh, default from navigator.language.
const KEY = 'cyber.lang';
const STR = {
  kicker: ['PRIVATE TEST LAB · 內部測試', 'PRIVATE TEST LAB'], sub: ['賽博街機 · 所有遊戲測試入口', 'All CYBER games · test entry point'],
  source: ['資料來源 games.json', 'source: games.json'], footer: ['未公開頁面 · 唔會被搜尋器收錄 · 請勿分享', 'Unlisted page · not indexed · please do not share'],
  live: ['{done} / {total} 已上線 · 更新 {date}', '{done} / {total} LIVE · updated {date}'], loading: ['載入中…', 'Loading…'], fail: ['載入 games.json 失敗', 'Failed to load games.json'],
  play: ['開始玩', 'PLAY'], demo: ['示範', 'DEMO'], bilingual: ['中／英', 'ZH / EN'], endless: ['無盡模式', 'ENDLESS'],
  done: ['已上線', 'LIVE'], wip: ['製作中', 'IN PROGRESS'], planned: ['計劃中', 'PLANNED'], retired: ['已退役', 'RETIRED'],
};
const norm = (l) => /^zh/i.test(l || '') ? 'zh-HK' : 'en';
let lang = (() => { const q = new URLSearchParams(location.search).get('lang'); if (q) { const l = norm(q); try { localStorage.setItem(KEY, l); } catch {} return l; }
  try { const s = localStorage.getItem(KEY); if (s === 'zh-HK' || s === 'en') return s; } catch {} return norm(navigator.language); })();
const zh = () => lang === 'zh-HK';
const t = (k, p = {}) => (STR[k] ? STR[k][zh() ? 0 : 1] : k).replace(/\{(\w+)\}/g, (_, n) => p[n] ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let data = null;
function render() {
  document.documentElement.lang = zh() ? 'zh-Hant-HK' : 'en'; document.documentElement.dataset.lang = zh() ? 'zh' : 'en';
  document.getElementById('lang').textContent = zh() ? 'EN' : '中';
  document.querySelectorAll('[data-k]').forEach((el) => { el.textContent = t(el.dataset.k); });
  if (!data) return;
  const list = document.getElementById('list'); list.innerHTML = '';
  const done = data.games.filter((g) => g.status === 'done').length;
  document.getElementById('count').textContent = t('live', { done, total: data.games.length, date: data.updated });
  const L = zh() ? 'zh' : 'en', O = zh() ? 'en' : 'zh';
  data.games.forEach((g, i) => {
    const live = g.status === 'done' || g.status === 'wip';
    const tags = [g.i18n ? t('bilingual') : '', g.endless ? t('endless') : ''].filter(Boolean).map((x) => `<span class="tag">${esc(x)}</span>`).join('');
    const el = document.createElement('article');
    el.className = 'card ' + g.status;
    el.innerHTML = `<div class="idx">${String(i + 1).padStart(2, '0')}</div>
      <div class="name-zh">${esc(g.name[L])}</div><div class="name-en">${esc(g.name[O])}</div>
      <div class="genre">${esc(g.genre?.[L])}</div>
      <span class="pill ${esc(g.status)}">${esc(STR[g.status] ? t(g.status) : g.status)}</span>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      <div class="meta">Play Store: ${esc(g.play)} · kit ${esc(g.kit)}</div>
      <div class="links">
        <a class="${live ? '' : 'off'}" href="${esc(g.url)}">${esc(t('play'))}<small>PLAY</small></a>
        <a class="demo ${live ? '' : 'off'}" href="${esc(g.demo)}">${esc(t('demo'))}<small>?DEMO=1</small></a>
        <a class="repo" href="${esc(g.repo)}">Repo<small>GITHUB</small></a>
      </div>`;
    list.appendChild(el);
  });
}
document.getElementById('lang').addEventListener('click', () => { lang = zh() ? 'en' : 'zh-HK'; try { localStorage.setItem(KEY, lang); } catch {} render(); });
document.getElementById('list').innerHTML = `<div class="err">${t('loading')}</div>`;
render();
fetch('../games.json', { cache: 'no-store' }).then((r) => r.json()).then((d) => { data = d; render(); })
  .catch((e) => { document.getElementById('list').innerHTML = `<div class="err">${esc(t('fail'))} · ${esc(e.message)}</div>`; });
</script>
</body>
</html>
